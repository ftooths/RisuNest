name: Android debug APK check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'crates/**'
      - 'scripts/retry-command.sh'
      - '.github/workflows/android-check.yml'

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK packages
        timeout-minutes: 15
        shell: bash
        run: |
          bash scripts/retry-command.sh sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Android project
        if: ${{ hashFiles('src-tauri/gen/android/gradlew') == '' }}
        run: pnpm android:init

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x src-tauri/gen/android/gradlew

      - name: Prepare Gradle distribution
        timeout-minutes: 10
        run: bash scripts/retry-command.sh bash src-tauri/gen/android/gradlew --version

      - name: Capture generated Android source baseline
        shell: bash
        run: git status --short --untracked-files=all -- src-tauri/gen/android > "$RUNNER_TEMP/android-gen.status.before"

      - name: Install fixed debug keystore
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        shell: bash
        run: |
          if [ -z "${KS:-}" ]; then
            echo "ANDROID_DEBUG_KEYSTORE_B64 not set; skipping fixed debug keystore."
            exit 0
          fi
          mkdir -p ~/.android
          printf '%s' "$KS" | tr -d '[:space:]' | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android

      - name: Build arm64 debug APK
        run: pnpm android:build:arm64

      - name: Run Android Kotlin unit tests
        working-directory: src-tauri/gen/android
        run: |
          ./gradlew :app:testArmDebugUnitTest --no-daemon
          ./gradlew :app:testLowMemorySafCopy --no-daemon
          ./gradlew :tauri-plugin-barcode-scanner:testDebugUnitTest --no-daemon

      - name: Verify APK alignment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apks = @(Get-ChildItem -Path 'src-tauri/gen/android/app/build/outputs/apk' -Recurse -Filter '*.apk')
          if ($apks.Count -ne 1) {
            throw "Expected exactly one arm64 debug APK, found $($apks.Count)."
          }
          $apk = $apks[0]
          $ks = Join-Path $HOME '.android/debug.keystore'
          $requireFixed = ($env:GITHUB_REPOSITORY -eq 'ftooths/RisuNest' -and $env:GITHUB_EVENT_NAME -ne 'pull_request')
          if (Test-Path -LiteralPath $ks -PathType Leaf) {
            $apksigner = Join-Path $env:ANDROID_HOME 'build-tools/36.0.0/apksigner'
            & $apksigner sign --ks $ks --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android $apk.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $certs = & $apksigner verify --print-certs $apk.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $certs
            if ($requireFixed -and (($certs | Out-String) -notmatch 'd5eeed1ad6940a820d5d6164f4c636e662aebc12823169267070255902b08683')) {
              throw 'APK signing certificate SHA-256 mismatch.'
            }
          } elseif ($requireFixed) {
            throw "Fixed debug keystore missing at $ks."
          }
          & ./util/checkAndroidAlignment.ps1 -ApkPath $apk.FullName *>&1 |
            Tee-Object -FilePath android-alignment.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify generated Android source is unchanged
        shell: bash
        run: |
          git status --short --untracked-files=all -- src-tauri/gen/android > "$RUNNER_TEMP/android-gen.status.after"
          if ! diff -u "$RUNNER_TEMP/android-gen.status.before" "$RUNNER_TEMP/android-gen.status.after"; then
            echo 'Build changed generated Android files.'
            exit 1
          fi

      - name: Upload arm64 debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload alignment log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-alignment-log
          path: android-alignment.log
          if-no-files-found: warn
          retention-days: 7
